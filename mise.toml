# mise は任意（Pythonバージョン固定 + タスクランナー）。
# mise が無い環境向けの手動セットアップ手順は README.md 参照。
[tools]
python = "3.13"
uv = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install the project (editable) into the mise-managed venv"
run = "uv pip install -e ."

[tasks.sample]
description = "Generate a synthetic sample photo for pipeline testing"
run = "python scripts/make_sample.py"

[tasks.run]
description = "Run the full pipeline (preprocess + Gemini status) on a sample image"
run = "python -m animal_dash_image_poc.cli run samples/sample_01.jpg -o output/sample_01"

[tasks.preprocess]
description = "Run only the OpenCV preprocessing step on a sample image"
run = "python -m animal_dash_image_poc.cli preprocess samples/sample_01.jpg -o output/sample_01.png --debug output/debug_sample_01"
